# 	
#	Basic Server inetd configuration file
#	Copyright (C) 1995, Xpert Unix Systems.
#
#
#  Various internal inetd services.
#
time	stream	tcp	nowait	root	internal
time	dgram	udp	wait	root	internal
echo	stream	tcp	nowait	root	internal
echo	dgram	udp	wait	root	internal
discard	stream	tcp	nowait	root	internal
discard	dgram	udp	wait	root	internal
daytime	stream	tcp	nowait	root	internal
daytime	dgram	udp	wait	root	internal
chargen	stream	tcp	nowait	root	internal
chargen	dgram	udp	wait	root	internal
#
#  Every basic server permits telnet access, for administration purpose.
#
telnet	stream	tcp	nowait	root	/usr/etc/tcpd	/usr/etc/in.telnetd
#
#
#  RFC931 complaint identd is a must.
#
auth	stream	tcp	nowait	sys	/usr/etc/in.identd	in.identd
shell   stream  tcp     nowait  root    /usr/etc/tcpd /usr/etc/in.rshd        
login   stream  tcp     nowait  root    /usr/etc/tcpd /usr/etc/in.rlogind    

# 
## End of basic server configuration file. Additional portions are added
## to the end of this file during system boot up.
## ** Do not modify anything below this line **
##END
#   USERS SERVER portion
#
#   Wu-ftpd for anonymous and/or real (chrooted) FTP access.
#
ftp	stream	tcp	nowait	root	/usr/etc/tcpd	/usr/local/etc/ftpd
#
#   Finger service on USERS is also desired.
#
## finger stream tcp	nowait	nobody	/usr/etc/tcpd	/usr/etc/in.fingerd
finger  stream  tcp     nowait  root    /usr/local/etc/fingerd  /usr/local/etc/fingerd -b
#
#   NFS Help daemons -- mountd and rquotad
#
mountd/1	dgram	rpc/udp	wait root /usr/etc/rpc.mountd	rpc.mountd
rquotad/1	dgram	rpc/udp	wait root /usr/etc/rpc.rquotad	rpc.rquotad
#
#   Remote mail reading protocols
#
imap    stream  tcp     nowait  root    /usr/etc/tcpd	/usr/local/etc/imapd
pop3    stream  tcp     nowait  root    /usr/etc/tcpd	/usr/local/etc/popper 
#
#  End of USERS SERVER portion
